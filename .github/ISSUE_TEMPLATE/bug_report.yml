name: Bug report
description: 报告可复现的任务、Provider、部署或界面问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先从诊断页确认版本，并移除 API Key、Token、Cookie、NAS 地址和私人媒体路径。
  - type: input
    id: version
    attributes:
      label: 拾幕版本
      placeholder: 0.5.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - MoviePilot 回调
        - Jellyfin 媒体库
        - Provider 搜索或下载
        - 字幕校验或对轴
        - WebUI
        - Docker 部署
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明期望行为、实际行为和复现步骤。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或诊断
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已移除凭据、Cookie、NAS 地址和私人媒体路径。
          required: true
