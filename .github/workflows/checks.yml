name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run --frozen --extra dev ruff check src tests
      - name: Test
        run: |
          mkdir -p .tmp
          uv run --frozen --extra dev python -m pytest -q -p no:cacheprovider --basetemp .tmp/pytest-ci
      - name: Build Docker image
        run: docker build --tag subpick:ci .
